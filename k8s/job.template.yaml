# Template for one-shot measurement Job. Jenkins substitutes __JOB_NAME__, __RUN_ID__, etc.
# Pod starts on Job create, runs test, exits; Job marks complete; pod is removed (ttlSecondsAfterFinished).
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: browser-performance
  labels:
    app.kubernetes.io/name: browser-performance-runner
    app.kubernetes.io/component: measurement-job
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser-performance-runner
        app.kubernetes.io/component: measurement-job
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: nexus-docker
      containers:
        - name: runner
          image: __RUNNER_IMAGE__
          imagePullPolicy: Always
          command: ["/bin/bash", "/app/scripts/k8s-entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: browser-performance-runner
          env:
            - name: RUN_ID
              value: "__RUN_ID__"
            - name: TEST_STAND
              value: "__TEST_STAND__"
            - name: PERFORMANCE_URLS_PROFILE
              value: "__PERFORMANCE_URLS_PROFILE__"
            - name: RUN_TIME
              value: "__RUN_TIME__"
            - name: PACING
              value: "__PACING__"
            - name: PERF_REQUEST_TIMEOUT
              value: "__PERF_REQUEST_TIMEOUT__"
            - name: CACHE_MODE
              value: "__CACHE_MODE__"
            - name: INFLUX_ENABLED
              value: "__INFLUX_ENABLED__"
            - name: INFLUX_URL
              value: "__INFLUX_URL__"
            - name: INFLUX_DATABASE
              value: "__INFLUX_DATABASE__"
            - name: INFLUX_MEASUREMENT
              value: "__INFLUX_MEASUREMENT__"
            - name: CHECK_ONLY
              value: "__CHECK_ONLY__"
            - name: GIT_URL
              value: "__GIT_URL__"
            - name: GIT_BRANCH
              value: "__GIT_BRANCH__"
            - name: GIT_SYNC
              value: "true"
            - name: USER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: browser-performance-secrets
                  key: USER_TOKEN
                  optional: true
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: browser-performance-secrets
                  key: ADMIN_TOKEN
                  optional: true
            - name: INFLUX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: browser-performance-secrets
                  key: INFLUX_USERNAME
                  optional: true
            - name: INFLUX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: browser-performance-secrets
                  key: INFLUX_PASSWORD
                  optional: true
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: browser-performance-secrets
                  key: GIT_USERNAME
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: browser-performance-secrets
                  key: GIT_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          securityContext:
            allowPrivilegeEscalation: false
